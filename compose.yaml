services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abyss
      POSTGRES_PASSWORD: abyss
      POSTGRES_DB: abyss
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["ocean-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U abyss"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["ocean-redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
  migrate:
    build: {context: ., target: api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://abyss:abyss@postgres:5432/abyss
    command: ["sh", "-c", "node --import tsx scripts/migrate.ts && node --import tsx prisma/seed.ts"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., target: api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://abyss:abyss@postgres:5432/abyss
      REDIS_URL: redis://redis:6379
    ports: ["3001:3001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build: {context: ., target: web}
    environment:
      API_INTERNAL_URL: http://api:3001
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  ocean-db:
  ocean-redis:
